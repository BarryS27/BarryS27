name: Cross Compile Webview for Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.2'

    - name: Get dependencies
      run: |
        go mod tidy

    - name: Build Execution File
      run: |
        go build -ldflags="-s -w -H windowsgui" -o aeolian_win_x64.exe .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-x64-Binary
        path: aeolian_win_x64.exe
