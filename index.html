<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aeolian</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --accent:#fff;
  --accent-glow:rgba(255,255,255,.2);
  --f: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fm:ui-monospace,"Cascadia Code","SF Mono","Segoe UI Mono",Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.25,1,.5,1);
}

html,body{height:100%;overflow:hidden;background:#000}
body{
  font-family:var(--f);color:#fff;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}

/* ── backgrounds ── */
.bg{
  position:fixed;inset:-80px;
  background-size:cover;background-position:center;
  filter:blur(75px) brightness(.38) saturate(2.2);
  transition:opacity 1.3s var(--ease);z-index:0;
}
#bg-a{opacity:1}#bg-b{opacity:0}

body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 100% 80% at 50% 35%,transparent 0%,rgba(0,0,0,.52) 100%),
    linear-gradient(to bottom,rgba(0,0,0,.28) 0%,transparent 20%,transparent 55%,rgba(0,0,0,.85) 100%);
}
@media(min-width:768px){
  body::after{
    background:
      radial-gradient(ellipse 120% 100% at 50% 50%,transparent 25%,rgba(0,0,0,.48) 100%),
      linear-gradient(to bottom,rgba(0,0,0,.3) 0%,transparent 15%);
  }
}

/* ── drop zone ── */
#drop-zone{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  transition:opacity .5s var(--ease),visibility .5s;
}
#drop-zone.gone{opacity:0;visibility:hidden;pointer-events:none}
body.drag-active #drop-zone{background:rgba(255,255,255,.03)}

.drop-ring{
  position:relative;width:120px;height:120px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.drop-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.13);
  animation:rspin 22s linear infinite;
}
.drop-ring::after{
  content:'';position:absolute;inset:9px;border-radius:50%;
  border:1px dashed rgba(255,255,255,.06);
  animation:rspin 14s linear infinite reverse;
}
@keyframes rspin{to{transform:rotate(360deg)}}

.drop-inner{
  width:84px;height:84px;border-radius:50%;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.03);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .25s,background .25s,transform .25s var(--spring);
}
.drop-ring:hover .drop-inner,.drop-ring:focus .drop-inner{
  border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);
}
.drop-ring:active .drop-inner{transform:scale(.95)}
body.drag-active .drop-inner{
  border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);
  transform:scale(1.06);
}
.drop-icon{opacity:.3;transition:opacity .25s}
.drop-ring:hover .drop-icon,body.drag-active .drop-icon{opacity:.65}

.drop-label{
  font-size:15px;font-weight:300;letter-spacing:.3px;
  color:rgba(255,255,255,.42);text-align:center;cursor:pointer;
}
.drop-sub{
  font-size:11px;font-weight:400;letter-spacing:1px;text-transform:uppercase;
  color:rgba(255,255,255,.17);margin-top:-12px;
}

/* ── app shell ── */
#app{
  position:relative;z-index:10;width:100%;
  max-width:360px;padding:0 28px;
  display:flex;flex-direction:column;align-items:stretch;
  opacity:0;visibility:hidden;
  transition:opacity .7s var(--ease),visibility .7s;
}
#app.show{opacity:1;visibility:visible}

@media(min-width:768px){
  #app{
    flex-direction:row;align-items:center;justify-content:center;
    max-width:1040px;gap:64px;padding:0 52px;
  }
  #art-scene{flex:0 0 min(42vw,460px);width:min(42vw,460px);margin-bottom:0}
  #panel{flex:1 1 340px;max-width:380px}
}
@media(min-width:1180px){
  #app{max-width:1160px;gap:88px}
  #art-scene{flex-basis:min(38vw,500px);width:min(38vw,500px)}
}

/* ── art ── */
#art-scene{width:100%;aspect-ratio:1;perspective:900px;margin-bottom:36px}

#art-card{
  width:100%;height:100%;border-radius:14px;overflow:hidden;
  position:relative;transform-style:preserve-3d;
  transition:transform .6s var(--spring),box-shadow .6s var(--ease);
  box-shadow:0 36px 90px rgba(0,0,0,.85),0 10px 28px rgba(0,0,0,.6);
  cursor:pointer;
}
#art-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;transition:opacity .5s var(--ease);
}
#vis-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;transition:opacity .5s;
}
#vis-canvas.show{opacity:1}
#art-grad{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#0e0a1a,#080808);
  opacity:0;transition:opacity .5s;
}
#art-grad.show{opacity:1}
/* specular */
#art-card::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(145deg,rgba(255,255,255,.06) 0%,transparent 38%,rgba(0,0,0,.1) 100%);
  pointer-events:none;z-index:2;
}

/* ── lyrics panel (over art) ── */
#lyrics-panel{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease);
  overflow:hidden;
}
#lyrics-panel.show{opacity:1;pointer-events:auto}
#lyrics-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:25% 8% 25%;
  scrollbar-width:none;scroll-behavior:smooth;
}
#lyrics-scroll::-webkit-scrollbar{display:none}
.lrc-line{
  display:block;text-align:center;
  font-size:17px;font-weight:500;line-height:1.55;letter-spacing:.15px;
  color:rgba(255,255,255,.22);
  padding:4px 0;
  transition:color .4s var(--ease),transform .4s var(--ease),font-size .4s var(--ease);
  cursor:default;
}
.lrc-line.cur{
  color:rgba(255,255,255,.96);font-size:19px;
  transform:scale(1.03);transform-origin:center;
}
.lrc-line.near{color:rgba(255,255,255,.52)}

/* ── info ── */
#panel{display:flex;flex-direction:column;min-width:0}
#info{margin-bottom:28px;min-height:52px}
#track-title{
  font-size:21px;font-weight:500;letter-spacing:-.25px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:rgba(255,255,255,.96);margin-bottom:5px;
  transition:opacity .25s,transform .25s;
}
#track-artist,#track-album{
  font-size:13px;font-weight:400;letter-spacing:.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .25s,transform .25s;
}
#track-artist{color:rgba(255,255,255,.52);margin-bottom:2px}
#track-album{color:rgba(255,255,255,.28)}
.fade-out{opacity:0!important;transform:translateY(-4px)!important}

/* ── scrubber ── */
#scrub-wrap{margin-bottom:28px}
#scrub-track{
  width:100%;height:3px;background:rgba(255,255,255,.1);
  border-radius:99px;position:relative;cursor:pointer;
  margin-bottom:10px;touch-action:none;
}
#scrub-track::before{content:'';position:absolute;inset:-9px 0}
#scrub-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:var(--accent);border-radius:99px;pointer-events:none;
  box-shadow:0 0 10px var(--accent-glow);
  transition:width .1s linear,background .6s,box-shadow .6s;
}
#scrub-track.sk #scrub-fill{transition:background .6s,box-shadow .6s}
#scrub-thumb{
  position:absolute;top:50%;left:0%;width:13px;height:13px;
  border-radius:50%;background:#fff;
  transform:translate(-50%,-50%) scale(0);
  transition:transform .2s var(--spring);pointer-events:none;
  box-shadow:0 1px 8px rgba(0,0,0,.7);z-index:2;
}
#scrub-track:hover #scrub-thumb,
#scrub-track.sk #scrub-thumb{transform:translate(-50%,-50%) scale(1)}
.time-row{
  display:flex;justify-content:space-between;
  font-family:var(--fm);font-size:11px;letter-spacing:.4px;
  color:rgba(255,255,255,.28);
}

/* ── controls ── */
#controls{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.ctl{
  width:42px;height:42px;border:none;background:none;
  cursor:pointer;outline:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.42);
  transition:color .18s,transform .18s var(--spring);
  -webkit-tap-highlight-color:transparent;position:relative;
}
.ctl:hover{color:rgba(255,255,255,.82);transform:scale(1.1)}
.ctl:active{transform:scale(.93)}
.ctl.lit{color:var(--accent)}
#btn-play{
  width:62px;height:62px;
  background:rgba(255,255,255,.96);color:#000;
  box-shadow:0 4px 22px rgba(0,0,0,.65),0 0 0 0 var(--accent-glow);
  transition:background .2s,transform .2s var(--spring),box-shadow .5s;
}
#btn-play:hover{
  background:#fff;transform:scale(1.06);
  box-shadow:0 6px 30px rgba(0,0,0,.75),0 0 0 10px var(--accent-glow);
}
#btn-play:active{transform:scale(.96)}

/* ── volume ── */
#vol-row{display:flex;align-items:center;gap:10px}
.vol-ico{opacity:.26;flex-shrink:0}
#vol-track{
  flex:1;height:3px;background:rgba(255,255,255,.1);
  border-radius:99px;position:relative;cursor:pointer;touch-action:none;
}
#vol-track::before{content:'';position:absolute;inset:-9px 0}
#vol-fill{
  position:absolute;left:0;top:0;bottom:0;width:35%;
  background:rgba(255,255,255,.38);border-radius:99px;
  pointer-events:none;transition:width .08s;
}

/* ── bottom actions row (info + playlist) ── */
#actions{
  position:fixed;bottom:28px;left:0;right:0;z-index:30;
  display:flex;align-items:center;justify-content:center;gap:28px;
  opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;
}
#actions.show{opacity:1;visibility:visible}
.action-btn{
  border:none;background:none;cursor:pointer;outline:none;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:30px;
  color:rgba(255,255,255,.28);font-family:var(--f);
  font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;
  transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;
}
.action-btn:hover{color:rgba(255,255,255,.6);background:rgba(255,255,255,.05)}
#pl-count{
  font-size:10px;background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.5);padding:2px 7px;border-radius:20px;
}

/* ── drawers (playlist + metadata) ── */
.drawer{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.92);
  backdrop-filter:blur(50px) saturate(1.7);
  -webkit-backdrop-filter:blur(50px) saturate(1.7);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .52s var(--spring);
}
.drawer.open{transform:none}

.drawer-hdr{
  padding:26px 26px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;
}
.drawer-hdr-title{
  font-size:12px;font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(255,255,255,.38);
}
.drawer-close{
  width:32px;height:32px;border:none;
  background:rgba(255,255,255,.07);border-radius:50%;
  cursor:pointer;color:rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s;
}
.drawer-close:hover{background:rgba(255,255,255,.12);color:#fff}

/* playlist */
#pl-scroll{
  flex:1;overflow-y:auto;padding:6px 0;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;
}
#pl-scroll::-webkit-scrollbar{width:4px}
#pl-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

.pl-row{
  display:flex;align-items:center;gap:14px;
  padding:10px 26px;cursor:pointer;transition:background .14s;
}
.pl-row:hover{background:rgba(255,255,255,.04)}
.pl-row.cur{background:rgba(255,255,255,.06)}

.pl-idx{
  width:22px;flex-shrink:0;text-align:right;
  font-family:var(--fm);font-size:12px;color:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:flex-end;
}
.pl-row.cur .pl-idx-n{display:none}
.pl-bars{display:none;align-items:flex-end;gap:2px;height:14px}
.pl-row.cur .pl-bars{display:flex}
.pb{width:3px;border-radius:1.5px;background:var(--accent);animation:pb .75s ease-in-out infinite alternate}
.pb:nth-child(1){height:5px}.pb:nth-child(2){height:12px;animation-delay:.25s}.pb:nth-child(3){height:7px;animation-delay:.1s}
@keyframes pb{to{height:3px}}
.pl-row.cur.paused .pb{animation-play-state:paused}

.pl-thumb{
  width:42px;height:42px;border-radius:7px;flex-shrink:0;
  background:rgba(255,255,255,.05);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.pl-thumb img{width:100%;height:100%;object-fit:cover;display:block}

.pl-meta{flex:1;min-width:0}
.pl-name{
  font-size:14px;font-weight:400;color:rgba(255,255,255,.7);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-row.cur .pl-name{color:#fff;font-weight:500}
.pl-sub{
  font-size:12px;color:rgba(255,255,255,.3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;
}
.pl-dur{font-family:var(--fm);font-size:11px;color:rgba(255,255,255,.25);flex-shrink:0}
.pl-row.cur .pl-dur{color:rgba(255,255,255,.45)}

/* metadata drawer */
#meta-scroll{flex:1;overflow-y:auto;padding:8px 0 32px;scrollbar-width:none}
#meta-scroll::-webkit-scrollbar{display:none}
.meta-art-row{
  display:flex;align-items:center;gap:18px;
  padding:20px 26px 24px;border-bottom:1px solid rgba(255,255,255,.05);
}
.meta-art{
  width:72px;height:72px;border-radius:10px;flex-shrink:0;
  background:rgba(255,255,255,.05);overflow:hidden;
}
.meta-art img{width:100%;height:100%;object-fit:cover;display:block}
.meta-track-title{font-size:17px;font-weight:500;color:rgba(255,255,255,.9);margin-bottom:4px;line-height:1.3}
.meta-track-sub{font-size:13px;color:rgba(255,255,255,.42);line-height:1.5}

.meta-section{padding:18px 26px 0}
.meta-section-title{
  font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(255,255,255,.28);margin-bottom:12px;
}
.meta-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);
}
.meta-row:last-child{border-bottom:none}
.meta-key{font-size:13px;color:rgba(255,255,255,.38);flex-shrink:0}
.meta-val{font-size:13px;color:rgba(255,255,255,.82);text-align:right;word-break:break-all}
.meta-val.mono{font-family:var(--fm);font-size:12px}

/* ── portrait lock for phone landscape ── */
#rotate-lock{display:none}
@media(max-width:767px) and (orientation:landscape){
  #rotate-lock{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;position:fixed;inset:0;z-index:999;background:#000;
  }
  #app,#drop-zone,#actions,.drawer,.bg{display:none!important}
}
.rot-icon{opacity:.38;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,100%{transform:rotate(0);}55%{transform:rotate(-90deg)}}
.rot-txt{font-size:13px;letter-spacing:.4px;color:rgba(255,255,255,.35)}

/* ── hint ── */
#hint{
  position:fixed;bottom:64px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.35px;color:rgba(255,255,255,.15);
  white-space:nowrap;z-index:15;pointer-events:none;transition:opacity 1.2s;
}
#hint.gone{opacity:0}
</style>
</head>
<body>

<div class="bg" id="bg-a"></div>
<div class="bg" id="bg-b"></div>

<input type="file" id="file-in" accept="audio/*" multiple style="display:none">

<div id="drop-zone">
  <div class="drop-ring" id="drop-ring" role="button" tabindex="0" aria-label="Choose audio files">
    <div class="drop-inner">
      <svg class="drop-icon" width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
  </div>
  <p class="drop-label" id="drop-lbl">Drop folder or files</p>
  <p class="drop-sub">MP3 · FLAC · M4A · WAV · OGG</p>
</div>

<div id="app">
  <div id="art-scene">
    <div id="art-card">
      <div id="art-grad"></div>
      <canvas id="vis-canvas"></canvas>
      <img id="art-img" src="" alt="" draggable="false">
      <div id="lyrics-panel">
        <div id="lyrics-scroll"></div>
      </div>
    </div>
  </div>

  <div id="panel">
    <div id="info">
      <div id="track-title"></div>
      <div id="track-artist"></div>
      <div id="track-album"></div>
    </div>

    <div id="scrub-wrap">
      <div id="scrub-track" role="slider" aria-label="Seek">
        <div id="scrub-fill"></div>
        <div id="scrub-thumb"></div>
      </div>
      <div class="time-row">
        <span id="t-cur">0:00</span>
        <span id="t-dur">0:00</span>
      </div>
    </div>

    <div id="controls">
      <button class="ctl lit" id="btn-shuf" title="Shuffle">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><polyline points="16 21 21 21 21 16"/>
          <path d="M4 20 21 3"/><path d="M21 21 15 15M9 9 4 4"/>
        </svg>
      </button>
      <button class="ctl" id="btn-prev" aria-label="Previous">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"/>
          <line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </button>
      <button class="ctl" id="btn-play" aria-label="Play / Pause">
        <svg id="ico-play" width="22" height="22" viewBox="0 0 24 24">
          <polygon points="6 3 20 12 6 21 6 3" fill="#000"/>
        </svg>
        <svg id="ico-pause" width="22" height="22" viewBox="0 0 24 24" style="display:none">
          <line x1="6" y1="4" x2="6" y2="20" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="18" y1="4" x2="18" y2="20" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="ctl" id="btn-next" aria-label="Next">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </button>
      <button class="ctl" id="btn-rep" title="Repeat all">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>

    <div id="vol-row">
      <svg class="vol-ico" width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="white" stroke-width="1.7" stroke-linecap="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      </svg>
      <div id="vol-track" role="slider" aria-label="Volume">
        <div id="vol-fill"></div>
      </div>
      <svg class="vol-ico" width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="white" stroke-width="1.7" stroke-linecap="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>
  </div>
</div>

<div id="actions">

<script>
// ═══════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════
const fmt = s => {
  if (!isFinite(s) || s < 0) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
};

// Detect image type from magic bytes so APIC MIME tag errors don't break art
function imgMime(data, fallbackMime) {
  if (!data || data.length < 4) return fallbackMime || 'image/jpeg';
  if (data[0]===0xff && data[1]===0xd8) return 'image/jpeg';
  if (data[0]===0x89 && data[1]===0x50 && data[2]===0x4e && data[3]===0x47) return 'image/png';
  if (data[0]===0x47 && data[1]===0x49 && data[2]===0x46) return 'image/gif';
  if (data[0]===0x52 && data[1]===0x49 && data[4]===0x57 && data[5]===0x45) return 'image/webp';
  return fallbackMime || 'image/jpeg';
}

const blobURL = (data, mime) => {
  try { return URL.createObjectURL(new Blob([data], {type: imgMime(data, mime)})); } catch { return null; }
};

// ═══════════════════════════════════════════════════════
//  METADATA PARSER  (ID3v2 · ID3v1 · FLAC/Vorbis · MP4)
// ═══════════════════════════════════════════════════════
const Meta = (() => {
  const u32be = (b,o) => ((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0;
  const u32le = (b,o) => (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0;
  const u16be = (b,o) => (b[o]<<8)|b[o+1];
  const ss    = (b,o) => ((b[o]&0x7f)<<21)|((b[o+1]&0x7f)<<14)|((b[o+2]&0x7f)<<7)|(b[o+3]&0x7f);
  const lat1  = b => new TextDecoder('latin1').decode(b).replace(/\0.*$/,'').trim();
  const u8    = b => new TextDecoder('utf-8').decode(b).replace(/\0/g,'').trim();

  function id3Str(bytes) {
    if (!bytes || !bytes.length) return '';
    const enc = bytes[0], raw = bytes.slice(1);
    try {
      if (enc===1) {
        const be = raw.length>=2 && raw[0]===0xfe && raw[1]===0xff;
        return new TextDecoder(be?'utf-16be':'utf-16le').decode(raw).replace(/\0/g,'').trim();
      }
      if (enc===2) return new TextDecoder('utf-16be').decode(raw).replace(/\0/g,'').trim();
      if (enc===3) return u8(raw);
      return lat1(raw);
    } catch { return ''; }
  }

  function id3Pic(b) {
    if (!b||b.length<4) return null;
    const enc=b[0]; let i=1;
    while (i<b.length && b[i]!==0) i++;
    const mime=lat1(b.slice(1,i))||'image/jpeg';
    i++; i++; // null + type
    if (enc===1||enc===2) { while(i+1<b.length&&!(b[i]===0&&b[i+1]===0)) i+=2; i+=2; }
    else { while(i<b.length&&b[i]!==0) i++; i++; }
    return i<b.length ? blobURL(b.slice(i), mime) : null;
  }

  function id3Lyrics(b) {
    // USLT: enc(1) + lang(3) + desc(null-term) + text
    if (!b||b.length<5) return null;
    const enc=b[0]; let i=4;
    if (enc===1||enc===2) { while(i+1<b.length&&!(b[i]===0&&b[i+1]===0)) i+=2; i+=2; }
    else { while(i<b.length&&b[i]!==0) i++; i++; }
    if (i>=b.length) return null;
    return id3Str(new Uint8Array([enc,...b.slice(i)])).trim()||null;
  }

  function id3v2(u8) {
    if (u8[0]!==0x49||u8[1]!==0x44||u8[2]!==0x33) return null;
    const ver=u8[3], flags=u8[5], size=ss(u8,6);
    let off=10;
    if (flags&0x40) off+=(ver===4?ss(u8,10):u32be(u8,10));
    const end=Math.min(off+size, u8.length);
    const r={};
    while (off<end-10 && u8[off]!==0) {
      const id=String.fromCharCode(u8[off],u8[off+1],u8[off+2],u8[off+3]);
      const fs=ver===4?ss(u8,off+4):u32be(u8,off+4);
      if (fs<=0||off+10+fs>end) break;
      const fd=u8.slice(off+10,off+10+fs); off+=10+fs;
      if (!r.title   && id==='TIT2') r.title    = id3Str(fd);
      if (!r.artist  && id==='TPE1') r.artist   = id3Str(fd);
      if (!r.album   && id==='TALB') r.album    = id3Str(fd);
      if (!r.albumArtist && id==='TPE2') r.albumArtist = id3Str(fd);
      if (!r.composer    && id==='TCOM') r.composer    = id3Str(fd);
      if (!r.genre       && id==='TCON') r.genre       = id3Str(fd).replace(/^\(?\d+\)?$/,'');
      if (!r.year        && id==='TDRC') r.year        = id3Str(fd).slice(0,4);
      if (!r.year        && id==='TYER') r.year        = id3Str(fd).slice(0,4);
      if (!r.track       && id==='TRCK') r.track       = id3Str(fd);
      if (!r.disc        && id==='TPOS') r.disc        = id3Str(fd);
      if (!r.art    && id==='APIC') r.art    = id3Pic(fd);
      if (!r.lyrics && id==='USLT') r.lyrics = id3Lyrics(fd);
    }
    return Object.keys(r).length ? r : null;
  }

  function id3v1(u8) {
    if (u8.length<128) return null;
    const t=u8.slice(u8.length-128);
    if (t[0]!==0x54||t[1]!==0x41||t[2]!==0x47) return null;
    const r={
      title:  lat1(t.slice(3,33)),
      artist: lat1(t.slice(33,63)),
      album:  lat1(t.slice(63,93)),
      year:   lat1(t.slice(93,97)),
    };
    return (r.title||r.artist) ? r : null;
  }

  function flacVorbis(u8, r) {
    let off=0;
    const vl=u32le(u8,off); off+=4+vl;
    const n=u32le(u8,off); off+=4;
    for (let i=0;i<n;i++) {
      if (off+4>u8.length) break;
      const cl=u32le(u8,off); off+=4;
      if (off+cl>u8.length) break;
      const s=u8(u8.slice(off,off+cl)); off+=cl;
      const eq=s.indexOf('='); if(eq<0) continue;
      const k=s.slice(0,eq).toUpperCase(), v=s.slice(eq+1);
      if (!r.title    && k==='TITLE')       r.title       = v;
      if (!r.artist   && k==='ARTIST')      r.artist      = v;
      if (!r.album    && k==='ALBUM')        r.album       = v;
      if (!r.albumArtist&&k==='ALBUMARTIST') r.albumArtist = v;
      if (!r.composer && k==='COMPOSER')    r.composer    = v;
      if (!r.genre    && k==='GENRE')       r.genre       = v;
      if (!r.year     && k==='DATE')        r.year        = v.slice(0,4);
      if (!r.track    && k==='TRACKNUMBER') r.track       = v;
      if (!r.disc     && k==='DISCNUMBER')  r.disc        = v;
      if (!r.lyrics   && k==='LYRICS')      r.lyrics      = v;
    }
  }

  function flacPic(u8) {
    let off=4; // skip type
    const ml=u32be(u8,off); off+=4;
    const mime=lat1(u8.slice(off,off+ml))||'image/jpeg'; off+=ml;
    const dl=u32be(u8,off); off+=4+dl;
    off+=16; // w,h,depth,colors
    const il=u32be(u8,off); off+=4;
    return off+il<=u8.length ? blobURL(u8.slice(off,off+il),mime) : null;
  }

  function flac(u8) {
    if (u8[0]!==0x66||u8[1]!==0x4c||u8[2]!==0x61||u8[3]!==0x43) return null;
    const r={sampleRate:0,channels:0};
    let off=4;
    // STREAMINFO is always first
    if (off+4<u8.length) {
      const type=u8[off]&0x7f, len=(u8[off+1]<<16)|(u8[off+2]<<8)|u8[off+3];
      if (type===0 && off+4+len<=u8.length) {
        const si=u8.slice(off+4,off+4+len);
        r.sampleRate=((si[10]<<12)|(si[11]<<4)|(si[12]>>4));
        r.channels=((si[12]>>1)&0x7)+1;
        r.bitsPerSample=((si[12]&1)<<4)|(si[13]>>4)+1;
      }
    }
    while (off<u8.length-4) {
      const last=(u8[off]&0x80)!==0, type=u8[off]&0x7f;
      const len=(u8[off+1]<<16)|(u8[off+2]<<8)|u8[off+3]; off+=4;
      if (off+len>u8.length) break;
      if (type===4) flacVorbis(u8.slice(off,off+len), r);
      if (type===6 && !r.art) r.art=flacPic(u8.slice(off,off+len));
      off+=len; if (last) break;
    }
    return Object.keys(r).length>2 ? r : null;
  }

  function mp4Atom(u8,s,e,name) {
    let off=s;
    while (off+8<=e) {
      const sz=u32be(u8,off);
      const ty=String.fromCharCode(u8[off+4],u8[off+5],u8[off+6],u8[off+7]);
      if (sz<8||off+sz>e+16) break;
      if (ty===name) return {s:off+8,l:sz-8};
      off+=sz;
    }
    return null;
  }

  function mp4(u8) {
    if (u8.length<12) return null;
    if (String.fromCharCode(u8[4],u8[5],u8[6],u8[7])!=='ftyp') return null;
    const moov=mp4Atom(u8,0,u8.length,'moov'); if(!moov) return null;
    // find ilst
    let meta=mp4Atom(u8,moov.s,moov.s+moov.l,'meta');
    if (!meta) { const udta=mp4Atom(u8,moov.s,moov.s+moov.l,'udta'); if(udta) meta=mp4Atom(u8,udta.s,udta.s+udta.l,'meta'); }
    if (!meta) return null;
    const ilst=mp4Atom(u8,meta.s+4,meta.s+meta.l,'ilst'); if(!ilst) return null;

    // audio sample entry for sample rate + channels
    const r={};
    const trak=mp4Atom(u8,moov.s,moov.s+moov.l,'trak');
    if (trak) {
      const mdia=mp4Atom(u8,trak.s,trak.s+trak.l,'mdia');
      if (mdia) {
        const minf=mp4Atom(u8,mdia.s,mdia.s+mdia.l,'minf');
        if (minf) {
          const stbl=mp4Atom(u8,minf.s,minf.s+minf.l,'stbl');
          if (stbl) {
            const stsd=mp4Atom(u8,stbl.s,stbl.s+stbl.l,'stsd');
            if (stsd && stsd.l>20) {
              // skip version(4)+entry_count(4)+entry_size(4)+codec(4)+reserved(6)+data_ref(2)
              const eo=stsd.s+16;
              if (eo+22<=stsd.s+stsd.l) {
                r.channels=u16be(u8,eo+8);
                r.sampleRate=u32be(u8,eo+16)>>16;
              }
            }
          }
        }
      }
    }

    let off=ilst.s; const end=ilst.s+ilst.l;
    while (off+8<=end) {
      const sz=u32be(u8,off); if(sz<8||off+sz>end) break;
      const ty=String.fromCharCode(u8[off+4],u8[off+5],u8[off+6],u8[off+7]);
      const ch=u8.slice(off+8,off+sz);
      const da=mp4Atom(ch,0,ch.length,'data');
      if (da&&da.l>8) {
        const flags=u32be(ch,da.s), pay=ch.slice(da.s+8,da.s+da.l);
        if (ty==='\u00a9nam'&&!r.title)  r.title  =u8(pay);
        if (ty==='\u00a9ART'&&!r.artist) r.artist =u8(pay);
        if (ty==='aART'     &&!r.albumArtist) r.albumArtist=u8(pay);
        if (ty==='\u00a9alb'&&!r.album)  r.album  =u8(pay);
        if (ty==='\u00a9wrt'&&!r.composer)r.composer=u8(pay);
        if (ty==='\u00a9gen'&&!r.genre)  r.genre  =u8(pay);
        if (ty==='\u00a9day'&&!r.year)   r.year   =u8(pay).slice(0,4);
        if (ty==='trkn'&&!r.track&&pay.length>=4) r.track=String(u16be(pay,2)||'');
        if (ty==='disk'&&!r.disc&&pay.length>=4)  r.disc =String(u16be(pay,2)||'');
        if (ty==='\u00a9lyr'&&!r.lyrics) r.lyrics =u8(pay);
        if (ty==='covr'&&!r.art) { const m=(flags&0xf)===0xe?'image/png':'image/jpeg'; r.art=blobURL(pay,m); }
      }
      off+=sz;
    }
    return Object.keys(r).length>2 ? r : null;
  }

  return {
    async parse(file) {
      const headSize = Math.min(file.size, 1048576);
      const head = new Uint8Array(await file.slice(0, headSize).arrayBuffer());

      // FLAC
      if (head[0]===0x66&&head[1]===0x4c&&head[2]===0x61&&head[3]===0x43)
        return flac(head) || {};

      // MP4/M4A
      if (head.length>=8 && String.fromCharCode(head[4],head[5],head[6],head[7])==='ftyp') {
        let r=mp4(head);
        if (!r && file.size>headSize) {
          const tail=new Uint8Array(await file.slice(Math.max(0,file.size-1048576)).arrayBuffer());
          r=mp4(tail);
        }
        return r||{};
      }

      // ID3v2
      const v2=id3v2(head);
      if (v2) {
        if ((!v2.title||!v2.artist) && file.size>=128) {
          const tail=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
          const v1=id3v1(tail);
          if (v1) { v2.title=v2.title||v1.title; v2.artist=v2.artist||v1.artist;
                    v2.album=v2.album||v1.album;  v2.year=v2.year||v1.year; }
        }
        return v2;
      }

      // ID3v1 only
      if (file.size>=128) {
        const tail=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
        return id3v1(tail)||{};
      }
      return {};
    }
  };
})();

// ═══════════════════════════════════════════════════════
//  LRC PARSER
// ═══════════════════════════════════════════════════════
function parseLRC(text) {
  const lines = [];
  for (const raw of text.split('\n')) {
    const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if (m) lines.push({ t: (+m[1])*60 + +m[2], text: m[3].trim() });
  }
  return lines.length ? lines.sort((a,b)=>a.t-b.t) : null;
}

// ═══════════════════════════════════════════════════════
//  COLOUR EXTRACTOR
// ═══════════════════════════════════════════════════════
function extractAccent(img) {
  try {
    const c=Object.assign(document.createElement('canvas'),{width:60,height:60});
    const ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,60,60);
    const d=ctx.getImageData(5,5,50,50).data;
    let r=0,g=0,b=0,n=0;
    for (let i=0;i<d.length;i+=4) {
      const l=d[i]*.299+d[i+1]*.587+d[i+2]*.114;
      if (l<18||l>238) continue;
      r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++;
    }
    if (!n) return null;
    r=r/n|0; g=g/n|0; b=b/n|0;
    const gray=(r+g+b)/3;
    r=Math.min(255,gray+(r-gray)*1.5|0);
    g=Math.min(255,gray+(g-gray)*1.5|0);
    b=Math.min(255,gray+(b-gray)*1.5|0);
    const lum=r*.299+g*.587+b*.114;
    if (lum<90) { const f=90/Math.max(lum,1); r=Math.min(255,r*f|0); g=Math.min(255,g*f|0); b=Math.min(255,b*f|0); }
    return { hex:'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''), rgb:`${r},${g},${b}` };
  } catch { return null; }
}

// ═══════════════════════════════════════════════════════
//  VISUALIZER
// ═══════════════════════════════════════════════════════
let actx, analyser, vizRAF;
const visCanvas = document.getElementById('vis-canvas');
const visCtx = visCanvas.getContext('2d');

function initAnalyser(el) {
  if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if (analyser) return;
  try {
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    actx.createMediaElementSource(el).connect(analyser);
    analyser.connect(actx.destination);
  } catch { analyser = null; }
}

function drawViz(accentRgb) {
  const bins = analyser ? analyser.frequencyBinCount : 64;
  const data = new Uint8Array(bins);
  if (analyser) analyser.getByteFrequencyData(data);
  const W=visCanvas.offsetWidth, H=visCanvas.offsetHeight, dpr=devicePixelRatio;
  visCtx.clearRect(0,0,W*dpr,H*dpr);
  const col = accentRgb||'160,140,255';
  const bw = (W/bins)*1.3;
  data.forEach((v,i) => {
    const h=(v/255)*H*.68, x=(i/bins)*W;
    visCtx.fillStyle=`rgba(${col},${.12+(v/255)*.6})`;
    visCtx.beginPath();
    visCtx.roundRect(x,(H-h)/2,bw*.8,h,2);
    visCtx.fill();
  });
  vizRAF = requestAnimationFrame(()=>drawViz(accentRgb));
}

function startViz(rgb) {
  cancelAnimationFrame(vizRAF);
  const dpr=devicePixelRatio;
  visCanvas.width=visCanvas.offsetWidth*dpr;
  visCanvas.height=visCanvas.offsetHeight*dpr;
  visCtx.scale(dpr,dpr);
  drawViz(rgb);
}
const stopViz = () => cancelAnimationFrame(vizRAF);

// ═══════════════════════════════════════════════════════
//  STATE  (pure in-memory, never persisted)
// ═══════════════════════════════════════════════════════
const S = {
  tracks:   [],   // {file, url, title, artist, album, albumArtist, composer,
                  //  genre, year, track, disc, art, lyrics, dur,
                  //  sampleRate, channels, bitsPerSample, lrcLines}
  queue:    [],   // shuffled index array (Fisher-Yates)
  qPos:     -1,   // position in queue
  cur:      -1,   // current track index
  playing:  false,
  shuffle:  true,
  repeat:   'all', // 'all' | 'one' | 'none'
  vol:      0.35,
};

// ═══════════════════════════════════════════════════════
//  FISHER-YATES SHUFFLE
// ═══════════════════════════════════════════════════════
function fisherYates(n) {
  const a = Array.from({length:n},(_,i)=>i);
  for (let i=n-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQueue(startIdx) {
  if (!S.shuffle) {
    S.queue = Array.from({length:S.tracks.length},(_,i)=>i);
    S.qPos  = startIdx ?? 0;
    return;
  }
  S.queue = fisherYates(S.tracks.length);
  if (startIdx !== undefined) {
    // put startIdx at position 0
    const p=S.queue.indexOf(startIdx);
    if (p>0) { [S.queue[0],S.queue[p]]=[S.queue[p],S.queue[0]]; }
    S.qPos=0;
  } else {
    S.qPos=0;
  }
}

  if (col) {
    root.style.setProperty('--accent', col.hex);

let lyricsOpen = false;
let lrcLines = null; // null=no lyrics, []timestamped, string=plain

function toggleLyrics() {
  const t = S.tracks[S.cur];
  if (!t) return;
  const hasLyrics = t.lrcLines || t.lyrics;
  if (!hasLyrics) return;
  lyricsOpen = !lyricsOpen;
  D.lyrPanel.classList.toggle('show', lyricsOpen);
  if (lyricsOpen) renderLyrics(t);
}

function renderLyrics(t) {
  D.lyrScrl.innerHTML = '';
  if (t.lrcLines) {
    lrcLines = t.lrcLines;
    t.lrcLines.forEach((l,i) => {
      const el=document.createElement('span');
      el.className='lrc-line'; el.dataset.i=i;
      el.textContent=l.text;
      D.lyrScrl.appendChild(el);
    });
    syncLyrics();
  } else if (t.lyrics) {
    lrcLines = null;
    t.lyrics.split('\n').forEach(line=>{
      const el=document.createElement('span');
      el.className='lrc-line near';
      el.textContent=line||'\u00a0';
      D.lyrScrl.appendChild(el);
    });
  }
}

let lastLrcIdx = -1;
function syncLyrics() {
  if (!lyricsOpen || !lrcLines) return;
  const ct=audio.currentTime;
  let idx=0;
  for (let i=0;i<lrcLines.length;i++) {
    if (lrcLines[i].t<=ct) idx=i; else break;
  }
  if (idx===lastLrcIdx) return;
  lastLrcIdx=idx;
  const els=D.lyrScrl.querySelectorAll('.lrc-line');
  els.forEach((el,i)=>{
    const d=i-idx;
    el.className='lrc-line'+(d===0?' cur':(Math.abs(d)<=2?' near':''));
  });
  const cur=els[idx];
  if (cur) cur.scrollIntoView({block:'center',behavior:'smooth'});
}

function loadTrack(idx, autoplay) {
  const t = S.tracks[idx];
  if (!t) return;
  S.cur = idx;
  lyricsOpen = false;
  D.lyrPanel.classList.remove('show');
  lrcLines = null; lastLrcIdx = -1;

  // Fade info
  D.title.classList.add('fade-out');
  D.artist.classList.add('fade-out');
  D.album.classList.add('fade-out');
  setTimeout(()=>{
    D.title.textContent  = t.title || stripExt(t.file.name);
    D.artist.textContent = t.artist || '';
    D.album.textContent  = t.album  || '';
    D.title.classList.remove('fade-out');
    D.artist.classList.remove('fade-out');
    D.album.classList.remove('fade-out');
  }, 180);

  audio.src = t.url;
  D.sFill.style.width='0%'; D.sThumb.style.left='0%';
  D.tCur.textContent='0:00'; D.tDur.textContent=fmt(t.dur||0);

  if (t.art) {
    stopViz();
    D.artVis.classList.remove('show');
    D.artGrad.classList.remove('show');
    D.artImg.style.opacity='0';
    // Set handlers BEFORE src — blob URLs can resolve synchronously
    D.artImg.onload = ()=>{
      D.artImg.style.opacity='1';
      const col=extractAccent(D.artImg);
      applyAccent(col);
      setBg(t.art);
    };
    D.artImg.onerror = ()=>{
      D.artVis.classList.add('show');
      D.artGrad.classList.add('show');
      applyAccent(null); setBg(null);
      try { initAnalyser(audio); startViz(null); } catch {}
    };
    D.artImg.src = t.art;
  } else {
    D.artImg.src=''; D.artImg.style.opacity='0';
    D.artVis.classList.add('show');
    D.artGrad.classList.add('show');
    applyAccent(null); setBg(null);
    if (autoplay) { try { initAnalyser(audio); startViz(null); } catch {} }
  }

  updatePlActive();

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title:  t.title  || stripExt(t.file.name),
      artist: t.artist || '',
      album:  t.album  || '',
      artwork: t.art ? [{src:t.art}] : [],
    });
  }

  if (autoplay) doPlay();
}

const stripExt = n => n.replace(/\.[^/.]+$/,'');

//  PLAYBACK
// ═══════════════════════════════════════════════════════
function doPlay() {
  if (actx?.state==='suspended') actx.resume();
  audio.play().then(()=>{
    S.playing=true;
    D.icoPlay.style.display='none'; D.icoPause.style.display='';
    updatePlActive();
    if (!S.tracks[S.cur]?.art) { try{initAnalyser(audio);startViz(null);}catch{} }
  }).catch(()=>{});
}
function doPause() {
  audio.pause(); S.playing=false;
  D.icoPlay.style.display=''; D.icoPause.style.display='none';
  updatePlActive();
}
const togglePlay = ()=> S.playing ? doPause() : doPlay();

function prevTrack() {
  if (audio.currentTime>3) { audio.currentTime=0; return; }
  S.qPos=(S.qPos-1+S.queue.length)%S.queue.length;
  loadTrack(S.queue[S.qPos], S.playing);
}

function nextTrack() {
  if (S.repeat==='one') { audio.currentTime=0; doPlay(); return; }
  S.qPos++;
  if (S.qPos>=S.queue.length) {
    buildQueue(); // reshuffle — playback never stops
  }
  loadTrack(S.queue[S.qPos], true);
}

// Auto-skip on error — no blocking dialogs
audio.addEventListener('error', ()=>{ if (S.tracks.length>1) nextTrack(); });
audio.addEventListener('ended', nextTrack);

audio.addEventListener('timeupdate', ()=>{
  if (!audio.duration) return;
  const p=(audio.currentTime/audio.duration)*100;
  D.sFill.style.width=p+'%'; D.sThumb.style.left=p+'%';
  D.tCur.textContent=fmt(audio.currentTime);
  if (lyricsOpen && lrcLines) syncLyrics();
  if ('mediaSession' in navigator && audio.duration)
    try { navigator.mediaSession.setPositionState({duration:audio.duration,position:audio.currentTime,playbackRate:1}); } catch {}
});

audio.addEventListener('loadedmetadata', ()=>{
  D.tDur.textContent=fmt(audio.duration);
  if (S.tracks[S.cur]) {
    S.tracks[S.cur].dur=audio.duration;
    // estimate bitrate now that we have size and duration
    const t=S.tracks[S.cur];
    if (!t.bitrate && t.file.size && audio.duration>0)
      t.bitrate=Math.round(t.file.size*8/audio.duration/1000);
    document.querySelectorAll('.pl-dur')
      .forEach((el,i)=>{ el.textContent=fmt(S.tracks[i]?.dur||0); });
  }
});

function buildMeta(t) {
  const title = t.title || stripExt(t.file.name);
  const fields = [
    ['Artist',       t.artist],
    ['Album',        t.album],
    ['Album Artist', t.albumArtist],
    ['Composer',     t.composer],
    ['Genre',        t.genre],
    ['Year',         t.year],
    ['Track',        t.track],
    ['Disc',         t.disc],
    ['Duration',     t.dur ? fmt(t.dur) : null],
    ['Bitrate',      t.bitrate ? t.bitrate+' kbps' : null],
    ['Sample Rate',  t.sampleRate ? (t.sampleRate/1000).toFixed(1)+' kHz' : null],
    ['Channels',     t.channels ? (t.channels===1?'Mono':t.channels===2?'Stereo':t.channels+' ch') : null],
    ['File Size',    (() => { const s=t.file.size; return s>1048576?(s/1048576).toFixed(1)+' MB':(s/1024).toFixed(0)+' KB'; })()],
    ['Format',       t.file.name.split('.').pop().toUpperCase()],
    ['Lyrics',       t.lyrics||t.lrcLines ? (t.lrcLines?'Synced LRC':'Embedded') : null],
    ['Artwork',      t.art ? 'Embedded' : null],
  ].filter(([,v])=>v);

  const tagRows=fields.filter(([k])=>!['Duration','Bitrate','Sample Rate','Channels','File Size','Format','Lyrics','Artwork'].includes(k));
  const techRows=fields.filter(([k])=>['Duration','Bitrate','Sample Rate','Channels','File Size','Format','Lyrics','Artwork'].includes(k));

  const row=([k,v])=>`<div class="meta-row"><span class="meta-key">${k}</span><span class="meta-val${['Bitrate','Sample Rate','Duration'].includes(k)?' mono':''}">${v}</span></div>`;

  D.metaScrl.innerHTML=`
    <div class="meta-art-row">
      <div class="meta-art">${t.art
        ?`<img src="${t.art}" alt="">`
        :`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.3" stroke-linecap="round" style="margin:24px"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`
      }</div>
      <div><div class="meta-track-title">${title}</div><div class="meta-track-sub">${[t.artist,t.album].filter(Boolean).join(' · ')}</div></div>
    </div>
    ${tagRows.length?`<div class="meta-section"><div class="meta-section-title">Tags</div>${tagRows.map(row).join('')}</div>`:''}
    ${techRows.length?`<div class="meta-section" style="margin-top:16px"><div class="meta-section-title">Technical</div>${techRows.map(row).join('')}</div>`:''}
  `;
}

// ═══════════════════════════════════════════════════════
//  FILE SCANNING  (emit as found, start on first)
// ═══════════════════════════════════════════════════════
const AUDIO_EXT = /\.(mp3|flac|aac|m4a|ogg|oga|wav|aiff|aif|opus|weba|wv|ape)$/i;
let lrcMap = {};  // basename → lrc text (for sidecar matching)

async function* walkEntry(entry) {
  if (entry.isFile) {
    yield await new Promise((res,rej)=>entry.file(res,rej));
  } else if (entry.isDirectory) {
    const reader=entry.createReader();
    let batch;
    do {
      batch = await new Promise((res,rej)=>reader.readEntries(res,rej));
      for (const e of batch) yield* walkEntry(e);
    } while (batch.length);
  }
}

async function loadFiles(fileList) {
  const all = [...fileList];
  // collect .lrc sidecars first (fast pass over non-audio)
  for (const f of all) {
    if (f.name.toLowerCase().endsWith('.lrc')) {
      const text = await f.text().catch(()=>'');
      if (text) lrcMap[f.name.toLowerCase().replace(/\.lrc$/,'')] = text;
    }
  }

  const audioFiles = all.filter(f=>f.type.startsWith('audio/')||AUDIO_EXT.test(f.name));
  if (!audioFiles.length) return;

  const wasEmpty = S.tracks.length === 0;

  // sort new batch by folder path then name before appending
  audioFiles.sort((a,b)=>(a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name));

  let firstLoaded = false;

  // show player shell immediately
  D.drop.classList.add('gone');
  D.app.classList.add('show');
  D.actions.classList.add('show');
  setTimeout(()=>D.hint.classList.add('gone'), 5000);

  for (const f of audioFiles) {
    const t = { file:f, url:URL.createObjectURL(f), title:'',artist:'',album:'',
                albumArtist:'',composer:'',genre:'',year:'',track:'',disc:'',
                art:null, lyrics:null, lrcLines:null,
                dur:0, bitrate:0, sampleRate:0, channels:0 };

    // parse metadata async (don't block first-track start)
    const metaPromise = Meta.parse(f).then(m=>{
      Object.assign(t, m);
      // attach sidecar LRC if present
      const base = f.name.toLowerCase().replace(/\.[^.]+$/,'');
      const lrcTxt = lrcMap[base];
      if (lrcTxt && !t.lrcLines) {
        const parsed = parseLRC(lrcTxt);
        if (parsed) t.lrcLines = parsed;
        else t.lyrics = t.lyrics || lrcTxt;
      } else if (t.lyrics) {
        // try to parse embedded lyrics as LRC
        const parsed = parseLRC(t.lyrics);
        if (parsed) { t.lrcLines=parsed; t.lyrics=null; }
      }
    }).catch(()=>{});

    S.tracks.push(t);

    if (wasEmpty && !firstLoaded) {
      firstLoaded=true;
      await metaPromise; // wait for first track meta before playing
      buildQueue(0);
      loadTrack(S.queue[0], true);
      buildPlaylist();
    } else {
      metaPromise.then(()=>{
        buildPlaylist();
        if (S.cur===S.tracks.indexOf(t)) {
          // refresh info if this was the current track (meta arrived late)
          D.title.textContent  = t.title || stripExt(t.file.name);
          D.artist.textContent = t.artist||'';
          D.album.textContent  = t.album ||'';
          if (t.art && !D.artImg.src) {
            D.artImg.onload=()=>{ D.artImg.style.opacity='1'; const col=extractAccent(D.artImg); applyAccent(col); setBg(t.art); };
            D.artImg.onerror=()=>{ D.artVis.classList.add('show'); D.artGrad.classList.add('show'); applyAccent(null); setBg(null); };
            D.artImg.src=t.art;
          }
        }
      });
    }
  }

  // rebuild queue with full track count after all files scanned, keep current track playing
  buildQueue(wasEmpty ? 0 : S.cur);
  buildPlaylist();
  D.plCount.textContent = S.tracks.length;
}

document.addEventListener('dragenter', e=>{e.preventDefault();document.body.classList.add('drag-active');});
document.addEventListener('dragover',  e=>e.preventDefault());
document.addEventListener('dragleave', e=>{if(!e.relatedTarget) document.body.classList.remove('drag-active');});
document.addEventListener('drop', async e=>{
  e.preventDefault(); document.body.classList.remove('drag-active');
  const items=[...e.dataTransfer.items];
  const files=[];
  // use DataTransferItem for folder support
  const entries=items.map(i=>i.webkitGetAsEntry?.()).filter(Boolean);
  if (entries.length) {
    for (const entry of entries) for await (const f of walkEntry(entry)) files.push(f);
    if (files.length) { loadFiles(files); return; }
  }
  loadFiles(e.dataTransfer.files);
});

// ═══════════════════════════════════════════════════════
//  FILE PICKER  (click to open)
// ═══════════════════════════════════════════════════════
function openPicker() {
  D.fileIn.click();
}

D.dropRing.addEventListener('click',  openPicker);
D.dropLbl.addEventListener('click',   openPicker);
D.dropRing.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker();} });
D.fileIn.addEventListener('change',   ()=>{ if(D.fileIn.files.length) loadFiles(D.fileIn.files); D.fileIn.value=''; });

// ═══════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if (e.target.tagName==='INPUT') return;
  switch(e.key) {
    case ' ':         e.preventDefault(); togglePlay(); break;
    case 'ArrowRight':e.preventDefault(); if(audio.duration) audio.currentTime=Math.min(audio.duration,audio.currentTime+5); break;
    case 'ArrowLeft': e.preventDefault(); if(audio.duration) audio.currentTime=Math.max(0,audio.currentTime-5); break;
    case 'ArrowUp':   e.preventDefault(); audio.volume=S.vol=Math.min(1,S.vol+.05); D.vFill.style.width=(S.vol*100)+'%'; break;
    case 'ArrowDown': e.preventDefault(); audio.volume=S.vol=Math.max(0,S.vol-.05); D.vFill.style.width=(S.vol*100)+'%'; break;
    case '[':  prevTrack(); break;
    case ']':  nextTrack(); break;
    case 'm': case 'M': audio.muted=!audio.muted; break;
    case 'l': case 'L': D.plDrw.classList.contains('open')?closeDrawer(D.plDrw):openDrawer(D.plDrw); break;
    case 'Escape': closeDrawer(D.plDrw); closeDrawer(D.metaDrw); break;
  }
});

// ═══════════════════════════════════════════════════════
//  MEDIA SESSION
// ═══════════════════════════════════════════════════════
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play',          doPlay);
  navigator.mediaSession.setActionHandler('pause',         doPause);
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack',     nextTrack);
  navigator.mediaSession.setActionHandler('seekto',        d=>{ if(audio.duration) audio.currentTime=d.seekTime; });
}
</script>
